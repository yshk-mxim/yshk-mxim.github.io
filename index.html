        '</div>'+
      '</div>'+
      '<nav class="links" aria-label="External profiles">'+lk+'</nav>'+
    '</header>'+
    '<main id="content">' +
    '<div class="tabs-wrap"><button class="tabs-arrow tabs-arrow-left hidden" aria-label="Scroll tabs left"><svg width="20" height="14" viewBox="0 0 20 14" fill="none"><path d="M19 7H2M2 7L8 1M2 7L8 13" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button><nav class="tabs" role="tablist">'+tb+'</nav><button class="tabs-arrow tabs-arrow-right" aria-label="Scroll tabs right"><svg width="20" height="14" viewBox="0 0 20 14" fill="none"><path d="M1 7H18M18 7L12 1M18 7L12 13" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>'+
    pn+
    '</main>'+
    '<footer>&copy; '+new Date().getFullYear()+' '+S.name+'</footer>';

  // Photo load
  var p = document.getElementById('ph');
  if(p){ p.onload=function(){p.classList.add('ok')}; p.onerror=function(){p.classList.add('no')}; }

  // Tab scroll arrows
  var tabsEl = document.querySelector('.tabs');
  var arrowR = document.querySelector('.tabs-arrow-right');
  var arrowL = document.querySelector('.tabs-arrow-left');
  function checkScroll(){
    var noOverflow = tabsEl.scrollWidth <= tabsEl.clientWidth;
    var atStart = tabsEl.scrollLeft < 4;
    var atEnd = tabsEl.scrollLeft + tabsEl.clientWidth >= tabsEl.scrollWidth - 4;
    arrowL.classList.toggle('hidden', atStart || noOverflow);
    arrowR.classList.toggle('hidden', atEnd || noOverflow);
  }
  arrowR.addEventListener('click', function(){ tabsEl.scrollBy({ left: 160, behavior: 'smooth' }); });
  arrowL.addEventListener('click', function(){ tabsEl.scrollBy({ left: -160, behavior: 'smooth' }); });
  tabsEl.addEventListener('scroll', checkScroll);
  window.addEventListener('resize', checkScroll);
  checkScroll();

  // Whole-card click for linked cards
  document.querySelectorAll('.card.has-link').forEach(function(card){
    card.addEventListener('click', function(e){
      if(e.target.tagName === 'A') return;
      window.open(card.dataset.url, '_blank', 'noopener');
    });
  });

  // Tab switching
  var allTabs = Array.from(document.querySelectorAll('.tab'));
  function activateTab(tab){
    allTabs.forEach(function(t){
      t.classList.remove('on');
      t.setAttribute('aria-selected','false');
      t.setAttribute('tabindex','-1');
    });
    document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('on')});
    tab.classList.add('on');
    tab.setAttribute('aria-selected','true');
    tab.setAttribute('tabindex','0');
    tab.focus();
    var panel = document.getElementById('p-'+tab.dataset.t);
    panel.classList.add('on');
    panel.querySelectorAll('.card').forEach(function(c){
      c.classList.remove('fi'); void c.offsetWidth; c.classList.add('fi');
    });
  }
  allTabs.forEach(function(tab){
    tab.addEventListener('click', function(){ activateTab(tab); });
    tab.addEventListener('keydown', function(e){
      var idx = allTabs.indexOf(tab);
      if(e.key==='ArrowRight'||e.key==='ArrowDown'){ e.preventDefault(); activateTab(allTabs[(idx+1)%allTabs.length]); }
      if(e.key==='ArrowLeft'||e.key==='ArrowUp'){ e.preventDefault(); activateTab(allTabs[(idx-1+allTabs.length)%allTabs.length]); }
      if(e.key==='Enter'||e.key===' '){ e.preventDefault(); activateTab(tab); }
    });
  });
})();
</script>
</body>
</html>
